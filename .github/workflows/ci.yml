# CI for the Modal service: every check here is CPU-only and needs no secrets, so it also runs
# on pull requests from forks. deploy.yml reuses this workflow as its gate.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      # The tests build REAL media with ffmpeg and probe it with ffprobe (no mocks).
      - name: ffmpeg
        run: command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      # Only what the deploy layer imports; the GPU stack (torch, whisper, IndicF5) is built
      # into the Modal image, never here. Verified by running the suites in a clean venv.
      - name: Install test dependencies
        run: pip install modal fastapi httpx python-multipart yt-dlp numpy requests urllib3

      - name: Every module under deploy/ and pipeline/ compiles
        run: python -m compileall -q deploy pipeline

      - name: The Modal app definition imports
        run: python -c "import deploy.modal_app as m; print('app:', m.app.name)"

      # A failing suite must fail the job; each exits non-zero on any failed check.
      - name: test_demo_ui
        run: python deploy/test_demo_ui.py
      - name: test_youtube_fetch
        run: python deploy/test_youtube_fetch.py
      - name: test_api_gate
        run: python deploy/test_api_gate.py
      - name: test_tts_fanout
        run: python deploy/test_tts_fanout.py
